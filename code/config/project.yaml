project:
  id: ais_paraspinal_ecology
  title: A donor-aware analysis of a modest concave-convex transcriptional signature in scoliosis paraspinal muscle
  organism: Homo sapiens
  genome_build: GRCh38

paths:
  raw_root: data/raw/public
  processed_root: data/processed
  results_root: results

datasets:
  scrna:
    accession: PRJNA722100
    assay: 10x Chromium Single Cell 3-prime RNA-seq
    expected_donors: 2
    sides: [concave, convex]
  bulk:
    accession: GSE254300
    assay: bulk RNA-seq
    ais_expected_donors: 5
    comparator_expected_donors: 5
    sides: [concave, convex]
  bulk_requantification:
    accession: GSE311180
    bioproject: PRJNA1368770
    assay: paired bulk RNA-seq
    complete_paired_donors: 7
    processed_matrix_gate: BLOCKED_METADATA_EXPRESSION_CONFLICT
    raw_fastq_gate: PASS
    sides: [concave, convex]
  adjacent_tissue:
    accession: GSE324067
    bioproject: PRJNA1433384
    assay: primary spinal osteoblast bulk RNA-seq
    complete_patient_triplets: 6
    sites: [concave, convex, non_curve]
    role: adjacent_tissue_specificity_negative_control
  muscle_reference:
    accession: GSE17503
    assay: Illumina HumanRef-8_v2_expression_array
    complete_biopsy_culture_pairs: 5
    side_labels_available: false
    role: tissue_vs_culture_reference_sensitivity_only
  published_only_muscle:
    - study: H19_ADIPOQ_2018
      pmid: 30241458
      reported_rnaseq_pairs: 5
      quantitative_meta_analysis: false
      reason: no_public_patient_level_expression_matrix
    - study: TENT5A_2022
      pmid: 35137485
      reported_bilateral_collection_patients: 20
      quantitative_meta_analysis: false
      reason: rnaseq_subset_and_patient_level_counts_not_public

design:
  biological_unit: patient
  contrast: concave_vs_convex
  paired: true
  sc_inference_policy: exploratory_effect_sizes_only_if_donors_lt_3
  bulk_model: "~ patient_id + side"
  secondary_bulk_model: "~ patient_id + side"
  disease_specificity_interaction: "~ pair_id + side_concave + side_concave:cohort_AIS"
  adjacent_tissue_model: "~ patient_id + site"
  pseudobulk_model: "~ patient_id + side"
